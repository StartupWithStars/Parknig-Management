<div class="app-layout-container">

  <div class="sidebar-wrapper">
    <div class="sidebar-brand-header">
      <h2><img src="assets/park-icon.jpeg" alt="" class="brand-logo-img"> SmartPark</h2>
      <span class="system-tag">Management System</span>
    </div>

    <nav class="sidebar-navigation-menu">
      <a routerLink="/dashboard" routerLinkActive="active-menu-item" class="nav-menu-link">
        <i class="fa-solid fa-chart-pie menu-icon-spec" style="color: rgb(145, 248, 145);"></i>
        Dashboard
      </a>

      <a routerLink="/parking" routerLinkActive="active-menu-item" class="nav-menu-link">
        <i class="fa-solid fa-square-parking menu-icon-spec fa-la" style="color: rgb(164, 196, 255);"
          style="margin-right: 3px;"></i>
        Parking
      </a>

      <a routerLink="/history" routerLinkActive="active-menu-item" class="nav-menu-link">
        <i class="fa-solid fa-clock-rotate-left menu-icon-spec" style="color: rgb(255, 203, 143);"></i>
        History
      </a>
    </nav>

    <div class="sidebar-user-footer">
      <div class="user-meta-row">
        <div class="user-meta-details">
          <strong>{{ loggedInUserName || 'Jeeva Revanth' }}</strong>
          <span>Administrator</span>
        </div>
        <button class="settings-btn" (click)="openSettingsModal()" title="Settings">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
      <button type="button" class="btn-sidebar-logout" (click)="openLogoutModal()"><i
          class="fa-solid fa-arrow-right-from-bracket logout-icon-spec"></i> Logout</button>
    </div>
  </div>

  <main class="main-content-canvas">

    <div class="content-scroll-viewport">
      <router-outlet></router-outlet>
    </div>
  </main>

  <div class="modal-backdrop" *ngIf="isSettingsOpen">
    <div class="modal-card">
      <div class="modal-header">
        <h4><i class="fa-solid fa-sliders"></i> Parking Settings</h4>
        <button class="close-btn" (click)="closeSettingsModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="totalSlots">Add Additional Slots</label>
          <input type="number" id="totalSlots" [(ngModel)]="slotsToAdd"
            placeholder="Enter slots (e.g. 100)" min="1" />
          <small class="error-msg" *ngIf="submitted && settingsForm.totalSlots <= 0">
            Slots must be greater than 0!
          </small>
        </div>

        <div class="form-group">
          <label for="ratePerHour">Rate Per Hour (₹)</label>
          <input type="number" id="ratePerHour" [(ngModel)]="settingsForm.ratePerHour"
            placeholder="Enter rate (e.g. 50)" min="1" />
          <small class="error-msg" *ngIf="submitted && settingsForm.ratePerHour <= 0">
            Rate must be greater than 0!
          </small>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" (click)="closeSettingsModal()">Cancel</button>
        <button class="btn-save" (click)="onSaveSettings()">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="logout-modal-backdrop" *ngIf="showLogoutModal">
  <div class="logout-modal-card">
    <div class="logout-modal-header">
      <div class="icon-wrap">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h4>Logout Confirmation</h4>
    </div>

    <div class="logout-modal-body">
      <p>Do you want to logout from <strong>SmartPark</strong></p>
    </div>

    <div class="logout-modal-footer">
      <button class="btn-no" (click)="closeLogoutModal()">No, Cancel</button>
      <button class="btn-yes" (click)="confirmLogout()">Yes, Logout</button>
    </div>
  </div>
</div>


</div>
